id: app.lumencode.LumenCode
runtime: org.kde.Platform
runtime-version: '5.15-21.08'
sdk: org.kde.Sdk
command: lumencode
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=session-bus
  - --talk-name=org.freedesktop.portal.Desktop
  - --device=dri
  - --filesystem=home
modules:
  - name: lumencode
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
